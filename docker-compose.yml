services:
  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - microservice-net

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RATE_LIMIT=1000
      - RATE_BURST=5000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - microservice-net

  wrk:
    image: williamyeh/wrk
    profiles: ["test"]
    depends_on:
      - app
    networks:
      - microservice-net

networks:
  microservice-net:
    driver: bridge
    name: microservice-net

volumes:
  minio-data: